<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Science Club BSSM — Question Boldly. Experiment Fiercely.</title>
    <meta
      name="description"
      content="Science Club BSSM is a student-led science community exploring robotics, green energy, space studies, synthetic biology, AI and quantum physics. Question boldly. Experiment fiercely. Discover together."
    />
    <meta name="theme-color" content="#06101f" />
    <meta property="og:title" content="Science Club BSSM" />
    <meta
      property="og:description"
      content="A student-led science community — robotics, green energy, space studies and beyond. Join the club."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='7' fill='%2338bdf8'/%3E%3Cellipse cx='32' cy='32' rx='27' ry='11' fill='none' stroke='%2334d399' stroke-width='4' transform='rotate(32 32 32)'/%3E%3Cellipse cx='32' cy='32' rx='27' ry='11' fill='none' stroke='%2338bdf8' stroke-width='4' transform='rotate(-32 32 32)'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved / system theme before first paint to avoid a flash.
      try {
        var t =
          localStorage.getItem('bssm-theme') ||
          (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
